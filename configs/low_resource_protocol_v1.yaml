stop_rules:
  - do not tune any threshold or hyperparameter on formal validation
  - do not silently discard failed runs or examples
  - do not promote negative BIO, CRF, span, BGE-pair, textual-KG-pair, or sampled-verifier ablations
  - stop before formal test until Phases A-E pass and the user explicitly unseals it
