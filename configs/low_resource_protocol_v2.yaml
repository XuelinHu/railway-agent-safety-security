protocol_id: low-resource-provenance-study-v2
status: frozen-pre-training
locked_at: '2026-08-30'
amended_from: low-resource-provenance-study-v1
amendment_reason: protocol-v1-terminal-cuda-oom-on-24gb-rtx3090
selection_split: validation
formal_test_status: sealed

paper:
  working_title: Provenance-Preserving Evidence-Gated Knowledge-Graph Augmentation for Low-Resource Safety Information Extraction
  positioning: safety-oriented provenance-preserving evidence-gated KG extraction with conservative abstention

amendment:
  unchanged:
    - train-document-selection-and-nesting
    - model-and-tokenizer-revision
    - optimizer-qlora-and-seeds
    - kg-v1-and-kg-v2-retrieval-settings
    - evaluation-statistics-and-formal-test-gate
  changed:
    - semantic-boundary-windowing-with-entity-span-protection
    - relation-evidence-rescue-windows-for-cross-window-relations
    - complete-sequence-hard-max-reduced-from-5120-to-4096
    - zero-overlength-skip-and-zero-truncation-required
    - pytorch-cuda-allocator-expandable-segments-enabled
  prohibited:
    - modifying-or-resuming-protocol-v1
    - discarding-entities-relations-or-overlength-examples
    - tuning-window-settings-on-validation-metrics

data:
  train_annotations: data/processed/reviewed/formal_split/train.jsonl
  train_index: data/processed/reviewed/formal_split/train_index.jsonl
  train_windows: data/processed/experiments/formal/windowed_train_v6
  validation_windows: data/processed/experiments/formal/windowed_validation_v6
  ontology: configs/risk_ontology.yaml
  low_resource_manifests: data/processed/experiments/formal/low_resource_manifests_v2
  source_selection_manifests: data/processed/experiments/formal/low_resource_manifests_v1
  budgets_documents: [10, 25, 50, 100]
  nested: true
  duplicate_cluster_closed: true
  selection_uses_validation: false

windowing:
  builder: scripts/build_semantic_window_dataset.py
  sequence_construction_cap: 3840
  training_hard_max_length: 4096
  max_segment_chars: 800
  segment_char_overlap: 160
  segment_overlap: 1
  boundary_priority: [sentence, paragraph, line, whitespace, hard-limit]
  protect_entity_spans: true
  protect_relation_evidence_quotes: true
  relation_rescue_windows: true
  relation_rescue_focus_max_chars: 480
  relation_rescue_focus_adaptive_to_required_span: true
  entity_coverage_required: 1.0
  relation_coverage_required: 1.0
  train_summary:
    path: data/processed/experiments/formal/windowed_train_v6/summary.json
    sha256: 26ca984b3d6bd6d91e3b3beb0786e1c6a83833b78cf5e13546e34f007f060660
    source_jobs: 244
    windows: 1266
    relation_rescue_windows: 286
    entities: 4335
    relations: 1510
  validation_summary:
    path: data/processed/experiments/formal/windowed_validation_v6/summary.json
    sha256: 426a0ce82c03f1c443e333ad97e575819fccc57686481d644b59fb20418cec83
    source_jobs: 51
    windows: 491
    relation_rescue_windows: 57
    entities: 1001
    relations: 343

seeds: [20260830, 20260831, 20260901]

systems:
  trainable:
    - id: baseline
      description: compact QLoRA without KG prompt context
      use_job_instruction: false
    - id: kg_v1
      description: compact QLoRA with conservative exact-match KG hints
      use_job_instruction: true
    - id: kg_v2
      description: compact QLoRA with evidence-gated high-recall KG context
      use_job_instruction: true
  derived:
    - id: kg_v2_verified
      source: kg_v2
    - id: kg_v3_raw
      sources: [kg_v1, kg_v2, kg_v2_verified]
    - id: kg_v3_final
      sources: [kg_v1, kg_v2, kg_v2_verified]

model:
  family: Qwen3-4B
  local_snapshot: /ds2/xuelin/cache/huggingface/hub/models--Qwen--Qwen3-4B/snapshots/1cfa9a7208912126459214e8b04321603b3df60c
  snapshot_revision: 1cfa9a7208912126459214e8b04321603b3df60c
  local_files_only: true

runtime_environment:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

training:
  trainer: scripts/train_qlora.py
  executor: scripts/run_low_resource_training_v2.py
  python: /home/xuelin/miniconda3/envs/rc-llm-comet/bin/python
  environment:
    python: 3.11.15
    torch: 2.11.0+cu130
    transformers: 4.57.6
    peft: 0.18.1
    accelerate: 1.13.0
    bitsandbytes: 0.49.2
    cuda: '13.0'
  epochs: 1
  batch_size: 1
  gradient_accumulation: 4
  learning_rate: 0.0002
  max_length: 4096
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  quantization: nf4-double-quant
  compute_dtype: bfloat16
  target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, down_proj, gate_proj]
  compact_target: true
  bucket_by_length: true
  length_bucket_size: 32
  skip_overlength: false
  truncated_answers_allowed: false
  truncated_prompts_allowed: false

kg_v1:
  builder: scripts/build_low_resource_v2_assets.py
  concept_limit: 20
  balanced_concepts: true
  exact_source_match: true
  leave_current_document_out: true

kg_v2:
  builder: scripts/build_kg_v2_jobs.py
  semantic_model: /ds2/xuelin/cache/huggingface/hub/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181
  semantic_model_revision: 5617a9f61b028005a4858fdac845db406aefb181
  semantic_threshold: 0.72
  semantic_limit: 4
  anchor_limit: 12
  anchor_per_type: 2
  edge_limit: 6
  min_type_purity: 0.8
  min_en_chars: 4
  min_zh_chars: 2
  leave_current_document_out: true

inference:
  runner: scripts/run_qlora_inference.py
  decoding: greedy
  max_input_tokens: 12288
  max_new_tokens: 4096
  max_seconds_per_job: 180
  max_repeated_entity: 6
  stop_on_complete_json: true
  failed_or_missing_job: empty_prediction
  mechanical_retry:
    allowed: true
    attempts: 1
    condition: infrastructure-failure-before-any-model-or-training-output
    generation_parameters_may_change: false

v3:
  frozen_reference: configs/kg_v3_frozen_validation.yaml
  relation_verifier:
    script: scripts/verify_relations.py
    require_local_cooccurrence: true
  entity_gate:
    script: scripts/fuse_kg_v1_v2_predictions.py
    relation_mode: verified
    acceptance_any_of:
      - v1_v2_exact_agreement
      - source_gated_anchor_type_match
      - verified_relation_endpoint

evaluation:
  primary:
    metric: strict-global-character-span-one-to-one
    script: scripts/evaluate_span_aware.py
    aggregation: prediction-level-micro
  secondary:
    - metric: relation-with-claim-status
      script: scripts/evaluate_span_aware.py
    - metric: evidence-and-signature-safety
      script: scripts/evaluate_evidence_graph.py
  language_reporting: separate-English-and-Chinese-micro
  missing_prediction_policy: empty_prediction
  empty_jobs_in_evidence_micro: do_not_add_zero_objects

statistics:
  unit: document
  bootstrap_resamples: 20000
  bootstrap_seed: 20260830
  confidence_interval: percentile-95
  paired_script: scripts/bootstrap_span_compare.py
  main_comparisons: [kg_v2-vs-kg_v1, kg_v3_raw-vs-kg_v2, kg_v3_final-vs-kg_v2]
  seed_summary: mean-standard_deviation-and-all-seed-values

telemetry:
  sample_interval_seconds: 2
  cost_assumption:
    scope: electricity-only-excludes-hardware-amortization-and-labor
    electricity_cny_per_kwh: 0.60
    usd_per_cny: 0.14
    frozen_at: '2026-08-30'

outputs:
  root: data/processed/experiments/formal/low_resource_v2
  run_directory_template: d{budget:03d}/seed{seed}/{system}
  immutable_hash_manifest: true

execution:
  trainable_runs: 36
  budget_order: [100, 10, 25, 50]
  first_gate: lr_v2_d100_seed20260830_baseline-only
  continue_d100_after_first_gate_success: true
  lower_budgets_after_all_d100_rows_complete: true
  formal_test_requires_explicit_user_confirmation: true

